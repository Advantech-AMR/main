version: '3.8'

services:
  # 核心服務：實體車與模擬器都需要的（Agent / Navigation）
  robot_base:
    image: tseng91301497/main-workspace-compose:v1.0
    network_mode: "host"
    privileged: true
    ipc: "host"
    pid: "host"
    runtime: nvidia
    tty: true
    stdin_open: true
    command: bash /scripts/robot_base.sh
    environment:
      - USER=ubuntu
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-36}
      - SIMULATE_MODE=${SIMULATE_MODE:-false}
      - ENABLE_FOXGLOVE=${ENABLE_FOXGLOVE:-false}
      - APP_MODE=${APP_MODE:-auto_explore}
      - WORLD_NAME=${WORLD_NAME:-my-nav-map}
      - MAP_PATH=${MAP_PATH:-/worlds/virtual/my-nav-map/maps/slam_map.yaml}
      - START_BASE_CONTROL=${START_BASE_CONTROL:-false}
      - START_LIDAR=${START_LIDAR:-false}
      - START_SLAM_TOOLBOX=${START_SLAM_TOOLBOX:-false}
      - START_NAV2=${START_NAV2:-false}
      - ENABLE_RVIZ=${ENABLE_RVIZ:-false}
      - ISAAC_ROS_WS=/workspace
    volumes:
      - /home/ubuntu/workspaces/main/robot_base:/workspace
      - /home/ubuntu/workspaces/main/worlds:/worlds
      - /home/ubuntu/workspaces/main/container_scripts:/scripts
      - /home/ubuntu/workspaces/main/rviz2_config:/rviz2_config
      - /etc/localtime:/etc/localtime:ro
      - /tmp:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/bus/usb:/dev/bus/usb
      - /dev/playrobot_base:/dev/playrobot_base
      - /dev/sllidar_a2m12:/dev/sllidar_a2m12

  # 自訂套件服務
  custom_packages:
    image: tseng91301497/main-workspace-compose:v1.0
    depends_on:
      - robot_base
    network_mode: "host"
    privileged: true
    ipc: "host"
    pid: "host"
    runtime: nvidia
    tty: true
    stdin_open: true
    command: bash /scripts/custom_packages.sh
    environment:
      - ISAAC_ROS_PLATFORM=arm64-jetpack
      - ISAAC_ROS_WS=/workspace
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - USER=ubuntu
      - ENABLE_RVIZ=${ENABLE_RVIZ:-false}
      - WORLD_NAME=${WORLD_NAME:-my-nav-map}
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-36}
      - SIMULATE_MODE=${SIMULATE_MODE:-false}
      - APP_MODE=${APP_MODE:-auto_explore}
      - ENABLE_WEB_CONTROLLER=${ENABLE_WEB_CONTROLLER:-false}
      - START_AUTO_EXPLORER=${START_AUTO_EXPLORER:-false}
    volumes:
      - /home/ubuntu/workspaces/main/custom_packages:/workspace
      - /home/ubuntu/workspaces/main/worlds:/worlds
      - /home/ubuntu/workspaces/main/container_scripts:/scripts
      - /home/ubuntu/workspaces/main/rviz2_config:/rviz2_config
      - /etc/localtime:/etc/localtime:ro
      - /tmp:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /usr/bin/tegrastats:/usr/bin/tegrastats

  # ZED 相機服務
  zed_packages:
    image: tseng91301497/main-workspace-compose:v1.0
    depends_on:
      - robot_base
    network_mode: "host"
    privileged: true
    ipc: "host"
    pid: "host"
    runtime: nvidia
    tty: true
    stdin_open: true
    command: bash /scripts/zed_packages.sh
    environment:
      - ISAAC_ROS_PLATFORM=arm64-jetpack
      - ISAAC_ROS_WS=/workspace
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LD_LIBRARY_PATH=/usr/local/zed/lib:/usr/local/cuda/lib64:/opt/ros/jazzy/share/gxf_isaac_optimizer/gxf/lib:/opt/ros/jazzy/opt/gz_math_vendor/lib
      - USER=ubuntu
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-36}
      - SIMULATE_MODE=${SIMULATE_MODE:-false}
      - APP_MODE=${APP_MODE:-auto_explore}
      - ZED_CAMERA_MODEL=${ZED_CAMERA_MODEL:-zed2i}
      - ENABLE_RVIZ=${ENABLE_RVIZ:-false}
      - START_ZED_CAMERA=${START_ZED_CAMERA:-false}
      - START_ZED_VISUALIZER=${START_ZED_VISUALIZER:-false}
      - START_ZED_MAPPING=${START_ZED_MAPPING:-false}
    volumes:
      - /home/ubuntu/workspaces/main/zed_packages:/workspace
      - /home/ubuntu/workspaces/main/object_detection_models:/models
      - /home/ubuntu/workspaces/main/container_scripts:/scripts
      - /home/ubuntu/workspaces/main/rviz2_config:/rviz2_config
      - /etc/localtime:/etc/localtime:ro
      - /tmp:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /usr/bin/tegrastats:/usr/bin/tegrastats
      - /sys/kernel/debug:/sys/kernel/debug
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra
      - /usr/src/jetson_multimedia_api:/usr/src/jetson_multimedia_api
      - /usr/src/jetson_sipl_api:/usr/src/jetson_sipl_api
      - /usr/share/vpi3:/usr/share/vpi3
      - /usr/local/zed:/usr/local/zed
      - /usr/local/cuda:/usr/local/cuda
      - /usr/local/cuda-13:/usr/local/cuda-13
      - /usr/local/cuda-13.0:/usr/local/cuda-13.0
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1